server.address=127.0.0.1
server.port=8097
spring.threads.virtual.enabled=true

spring.datasource.url=${TRIAGE_DB_URL:jdbc:mysql://127.0.0.1:3306/triage}
spring.datasource.username=${TRIAGE_DB_USER:triage}
spring.datasource.password=${TRIAGE_DB_PASSWORD:}

triage.control-sock=${TRIAGE_CONTROL_SOCK:/run/triage-gestor/control.sock}
triage.mcp-url=http://127.0.0.1:8098
triage.modelo=mistral-small-2603
triage.gasto-diario=1.00
triage.maximo-diario=30
triage.maximo-por-ip=3
triage.mistral-clave=${MISTRAL_API_KEY:}
triage.turnstile-secreto=${TURNSTILE_SECRET:}
triage.turnstile-sitekey=${TURNSTILE_SITEKEY:}
