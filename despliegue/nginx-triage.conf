# Triage: https://triage.deveps.dev
# Certificado previo: sudo certbot certonly --nginx -d triage.deveps.dev (este archivo no lo modifica certbot).
# Sin access_log y con error_log mínimo: las IP no se guardan y el token de los eventos va en la URL.

limit_req_zone $binary_remote_addr zone=triage_crear:1m rate=6r/m;
limit_req_zone $binary_remote_addr zone=triage_api:1m rate=120r/m;
limit_conn_zone $binary_remote_addr zone=triage_eventos:1m;

map $uri $triage_cache {
    ~^/api/                       "no-store";
    ~*\.(?:js|css|woff2?)$        "public, max-age=31536000, immutable";
    default                       "no-cache";
}

server {
    # Con HTTP/2 los eventos no gastan una de las 6 conexiones por dominio del navegador.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name triage.deveps.dev;

    ssl_certificate /etc/letsencrypt/live/triage.deveps.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/triage.deveps.dev/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/triage;
    index index.html;

    access_log off;
    error_log /var/log/nginx/triage-error.log crit;
    client_max_body_size 8k;
    server_tokens off;

    include snippets/deveps-hardening.conf;

    # Ningún location define add_header: si lo hiciera, dejaría de heredar estas cabeceras.
    add_header Cache-Control $triage_cache always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-src https://challenges.cloudflare.com; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Connection "";
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_hide_header Cache-Control;
    proxy_connect_timeout 5s;

    limit_req_status 429;
    limit_conn_status 429;

    location / {
        try_files $uri $uri/ =404;
    }

    # Lista cerrada: lo que no aparece aquí no llega a la API.
    location = /api/estado {
        limit_except GET { deny all; }
        limit_req zone=triage_api burst=30 nodelay;
        proxy_pass http://127.0.0.1:8097;
    }

    location = /api/investigaciones {
        limit_except POST { deny all; }
        limit_req zone=triage_crear burst=2 nodelay;
        proxy_read_timeout 90s;
        proxy_pass http://127.0.0.1:8097;
    }

    location ~ ^/api/investigaciones/[A-Za-z0-9_-]+/eventos$ {
        limit_except GET { deny all; }
        limit_req zone=triage_api burst=30 nodelay;
        limit_conn triage_eventos 4;
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        # Más que la vida máxima de un entorno (6 min).
        proxy_read_timeout 420s;
        proxy_pass http://127.0.0.1:8097;
    }

    location ~ ^/api/investigaciones/[A-Za-z0-9_-]+/(?:aprobar|rechazar)$ {
        limit_except POST { deny all; }
        limit_req zone=triage_api burst=30 nodelay;
        proxy_read_timeout 30s;
        proxy_pass http://127.0.0.1:8097;
    }

    location /api/ {
        return 404;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name triage.deveps.dev;
    access_log off;
    return 301 https://$host$request_uri;
}
